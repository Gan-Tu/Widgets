name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # test:widgets uses --experimental-strip-types (Node >= 22.6)
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build demo app
        run: npm run build

      - name: Build widget package and run tests
        run: npm run test:widgets
